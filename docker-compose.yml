version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-demo}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build: .
    command: python run_etl.py
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:admin@db:5432/demo}
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:admin@db:5432/demo}
    depends_on:
      etl:
        condition: service_completed_successfully
    restart: unless-stopped
